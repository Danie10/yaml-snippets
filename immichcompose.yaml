# WARNING: Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Can use containernamne:intport if container on same docker network
#
name: immich

networks:
  myomvlan:
    external: true
    name: myomvlan

services:
  immich-server:
    container_name: immich-server
    hostname: immich-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    devices:
      # To pass through GPU for container use
      - /dev/dri:/dev/dri
    group_add:
      - 80    # video GID from ls -l /dev/dri/card0
      - 226   # render GID from ls -l /dev/dri/renderD128
    #extends:
    # Not needed if the device passthrough is done
    #  file: hwaccel.transcoding.yml
    #  service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      - /srv/dev-disk-by-uuid-e6c3b71f-ef88-4055-a599-fb607c4baed2/data/appdata/Config/jellyfin/media/MyYouTube:/mnt/ytvideos:rw
    env_file:
      - stack.env
    networks:
      - myomvlan
    # Ports can be commented out if container is on same docker network as Nginx Proxy Manager
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2283/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      wud.display.name: Immich Server


  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    hostname: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    networks:
      - myomvlan
    volumes:
      - /srv/dev-disk-by-uuid-e6c3b71f-ef88-4055-a599-fb607c4baed2/data/appdata/Config/Immich/model-cache:/cache
    env_file:
      - stack.env
    restart: unless-stopped
    healthcheck:
      disable: false
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      wud.display.name: Immich Machine Learning

  redis:
    container_name: immich_redis
    hostname: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - myomvlan
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      wud.link.template: "https://github.com/valkey-io/valkey/releases/tag/$${major}.$${minor}.$${patch}"
      wud.display.name: Immich Redis

  database:
    container_name: immich_postgres
    hostname: immich_postgres
#    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    image: ghcr.io/immich-app/postgres:14-vectorchord0.5.3-pgvector0.8.1
    env_file:
      - stack.env
    networks:
      - myomvlan
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      wud.display.name: Immich PostgresDB Stayv14
      # This line prevents upgrading past major version 14
      wud.tag.include: "^14-.*$"
      wud.tag.semver: "false"
  immich-public-proxy:
    image: alangrainger/immich-public-proxy:latest
    container_name: immich-public-proxy
    hostname: immich-public-proxy
    restart: unless-stopped
    depends_on:
      immich-server:
        condition: service_healthy
    networks:
      - myomvlan
    # Ports can be commented out if container is on same docker network as Nginx Proxy Manager
    ports:
      - "3012:3000"
    environment:
      - IMMICH_URL=${IMMICH_URL}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      wud.display.name: Immich Public Proxy
      wud.link.template: "https://github.com/alangrainger/immich-public-proxy/releases"
    volumes:
      - /srv/dev-disk-by-uuid-e6c3b71f-ef88-4055-a599-fb607c4baed2/data/appdata/Config/Immich/immich_proxy/config.json:/app/config.json:ro
    healthcheck:
      test: curl -s http://immich-public-proxy:3000/share/healthcheck -o /dev/null || exit 1
      start_period: 10s
      timeout: 5s

